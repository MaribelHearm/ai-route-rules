name: Sync public AI rules
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rules/payment.yaml', 'rules/accounts.yaml']
permissions:
  contents: write
concurrency:
  group: public-rules-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/update.py
      - name: Commit changed content only
        id: commit
        shell: bash
        run: |
          if ! git diff --quiet -- rules/ai.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rules/ai.yaml
            git commit -m 'Update public AI destination rules'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh CDN after publishing
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          RULES_REPOSITORY: ${{ github.repository }}
        run: python scripts/purge_cdn.py
